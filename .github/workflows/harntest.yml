name: tea

on:
  workflow_call:
    inputs:
      test-path:
        description: Path to agent test directory or file (e.g. examples/agent-tests)
        required: true
        type: string
      iterations:
        description: Number of times to run each test function
        required: false
        type: number
        default: 1

jobs:
  agent-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tea
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run agent tests
        run: |
          set -o pipefail
          tea ${{ inputs.test-path }} -n ${{ inputs.iterations }} 2>&1 | tee tea-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tea-test-output
          path: tea-output.txt
