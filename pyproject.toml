[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teaval"
version = "0.0.1"
description = "Testing tool for agentic CLI tools (Claude Code, Pi) in Docker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rsn491" }, { name = "krimvp" }]
keywords = ["agents", "testing", "evaluation", "llm", "claude-code", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "docker>=7.0",
    "pydantic-ai>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/rsn491/tea"
Repository = "https://github.com/rsn491/tea"
Issues = "https://github.com/rsn491/tea/issues"

[project.scripts]
tea = "tea.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "pre-commit>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: marks tests that require a running Docker daemon and valid API keys (deselect with '-m not integration')",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PLC0415"]
