[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tea"
version = "0.1.0"
description = "Testing tool for agentic CLI tools (Claude Code, Codex) in Docker"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "docker>=7.0",
    "pydantic-ai>=1.0",
]

[project.scripts]
tea = "tea.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "pre-commit>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: marks tests that require a running Docker daemon and valid API keys (deselect with '-m not integration')",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PLC0415"]
