repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src/|tests/|examples/).+\.py$
      - id: ruff-format
        files: ^(src/|tests/|examples/).+\.py$

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        args: [tests/unit, -q]
        pass_filenames: false
        always_run: true
