repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^(src/|tests/unit/).+\.py$

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args: [--persistent=n, src/harntest/]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: pytest
        language: system
        args: [tests/unit, -q]
        pass_filenames: false
        always_run: true
